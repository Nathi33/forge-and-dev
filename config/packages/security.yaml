# config/packages/security.yaml
security:
    # Hashage des mots de passe pour les utilisateurs
    password_hashers:
        App\Entity\User: 'auto'

    # Fournisseur d'utilisateurs basé sur l'entité User
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            custom_authenticator: App\Security\LoginFormAuthenticator
            logout:
                path: app_logout
                target: /login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 semaine
                path: /

    access_control:
        # Protège toutes les pages /admin avec le rôle ROLE_ADMIN
        - { path: ^/admin, roles: ROLE_ADMIN }
        # Tu peux ajouter d'autres règles si nécessaire
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10